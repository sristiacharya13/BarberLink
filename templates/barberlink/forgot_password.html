
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% translate "Forgot Password" %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: green;
    }

    form {
      margin: 15px auto;
    }

    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    button[type="submit"] {
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
    }
    a {
      color: green;
    }
  </style>
</head>
<body>
  <h1>{% translate "Forgot Password" %}</h1>

  <p>{% translate "Enter your registered email address to reset your password." %}</p>

  <form method="post">
    {% csrf_token %}

    <label for="email">{% translate "Email" %}</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">{% translate "Reset Password" %}</button>
  </form>

  <a href="/login/">{% translate "Back to Login" %}</a>
</body>
</html>
