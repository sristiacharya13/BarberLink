
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% translate "Password Reset Successful" %}</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  margin: 20px;
  text-align: center;
}

h1 {
  color: green;
  margin-top: 40px;
}

p {
  color: #444;
  margin: 20px auto;
  max-width: 500px;
}

a {
  display: inline-block;
  color: white;
  background-color: green;
  text-decoration: none;
  padding: 10px;
  border-radius: 5px;
}

a:hover {
  background-color: darkgreen;
}
  </style>
</head>
<body>
  <h1>{% translate "Password Reset Successful" %}</h1>

  <p>
    {% translate "Your password has been changed successfully." %}
  </p>

  <a href="{% url 'login_page' %}">
    {% translate "Log In Now" %}
  </a>
</body>
</html>
