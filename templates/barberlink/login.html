{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title></head>
<body>
  <form action="{% url 'set_language' %}" method="post" style="display:inline">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <select name="language" onchange="this.form.submit()">
        <option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>English</option>
        <option value="kn" {% if LANGUAGE_CODE == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
      </select>
  </form>
  <h1>{% translate "Login" %}</h1>
  <p id="error" style="color:#b00020"></p>
  <form id="login-form" style="max-width:220px;">
    <input type="tel" id="contact_number" placeholder={% translate "Contact number" %} autocomplete="tel" required style="width:100%;box-sizing:border-box;"><br>
    <div style="position:relative;display:inline-block;width:100%;">
      <input type="password" id="password" placeholder={% translate "Password" %} autocomplete="current-password" required style="width:100%;box-sizing:border-box;padding-right:40px;">
      <button type="button" id="toggle-password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:0.9em;color:#666;">Show</button>
    </div><br>
    <button type="submit">{% translate "Login" %}</button>
  </form>
  <p>{% translate "No account?" %}<a href="/register/">{% translate "Register" %}</a></p>
  <script>
    const DASHBOARDS = { barber: "/barbers/dashboard/", customer: "/customers/dashboard/" };
    const pwd = document.getElementById("password");
    const toggle = document.getElementById("toggle-password");
    toggle.addEventListener("click", function() {
      if (pwd.type === "password") {
        pwd.type = "text";
        toggle.textContent = "Hide";
      } else {
        pwd.type = "password";
        toggle.textContent = "Show";
      }
    });
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.textContent = "";
      const res = await fetch("/api/v1/auth/login/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contact_number: document.getElementById("contact_number").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.detail || "Login failed."; return; }
      localStorage.setItem("access", data.access);
      localStorage.setItem("refresh", data.refresh);
      window.location.href = DASHBOARDS[data.user.role];
    });
  </script>
</body>
</html>
